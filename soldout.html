<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ClearMobi | เครดิตผลงาน</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .sold-header { text-align: center; margin-bottom: 25px; }
        .sold-list { display: flex; flex-direction: column; gap: 15px; }
        .glass-card-sold {
            display: flex; flex-direction: row; align-items: center; gap: 15px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.02));
            backdrop-filter: var(--glass-blur); border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px; padding: 15px; position: relative; overflow: hidden;
        }
        .sold-stamp { position: absolute; top: 15px; right: -25px; transform: rotate(45deg); background: rgba(231, 76, 60, 0.9); color: #fff; padding: 4px 30px; font-size: 10px; font-weight: bold; box-shadow: 0 2px 10px rgba(231, 76, 60, 0.5); z-index: 10; letter-spacing: 1px; }
        .success-stamp { background: rgba(16, 185, 129, 0.9); box-shadow: 0 2px 10px rgba(16, 185, 129, 0.5); }
        .sold-img-wrapper { width: 80px; height: 80px; flex-shrink: 0; display: flex; justify-content: center; align-items: center; }
        .sold-img { width: 100%; height: 100%; object-fit: contain; filter: grayscale(40%) contrast(1.2); opacity: 0.8; }
        .sold-info { flex: 1; text-align: left; }
        .sold-title { font-size: 15px; color: #fff; font-weight: bold; margin-bottom: 3px; line-height: 1.2;}
        .sold-price { font-size: 14px; font-weight: bold; color: var(--text-muted); text-decoration: line-through; margin-bottom: 8px;}
        .sold-buyer { font-size: 11px; color: var(--accent-green); background: rgba(16, 185, 129, 0.15); padding: 4px 10px; border-radius: 8px; display: inline-block; border: 1px solid rgba(16, 185, 129, 0.3);}
        .vip-badge { position: absolute; top: 10px; left: 10px; width: 25px; height: 25px; object-fit: contain; z-index: 10; filter: drop-shadow(0 2px 5px rgba(0,0,0,0.5));}
    </style>
</head>
<body class="theme-spirited">

    <div class="top-nav">
        <a href="index.html" style="position: absolute; left: 20px; text-decoration: none; color: inherit; font-size: 20px;">←</a>
        <div class="logo-c" style="font-size: 18px;">เครดิตผลงาน</div>
    </div>

    <div class="container">
        <div class="sold-header">
            <div style="font-size: 36px; margin-bottom: 5px;">🏆</div>
            <h3 style="color: #fff; font-size: 20px;">ประวัติการขายล่าสุด</h3>
        </div>

        <div class="sold-list">
            <div class="glass-card-sold">
                <img src="images/badge-diamond.png" class="vip-badge" alt="VIP">
                <div class="sold-stamp">SOLD OUT</div>
                <div class="sold-img-wrapper"><img src="images/phone-14-blue.png" class="sold-img" alt="Phone"></div>
                <div class="sold-info">
                    <div class="sold-title">iPhone 14</div>
                    <div class="sold-price">฿18,500</div>
                    <div class="sold-buyer">ปิดดีลโดยคุณสมชาย</div>
                </div>
            </div>
        </div>
    </div>

    <!-- เมนูด้านล่าง 6 เมนู -->
    <div class="bottom-nav">
        <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span>หน้าแรก</a>
        <a href="marketplace.html" class="nav-item"><span class="nav-icon">🛒</span>ซื้อ</a>
        <a href="evaluate.html" class="nav-item"><span class="nav-icon">🤝</span>ขาย</a>
        <a href="trade-in.html" class="nav-item"><span class="nav-icon">🔄</span>เทิร์น</a>
        <a href="tracking.html" class="nav-item"><span class="nav-icon">📍</span>สถานะ</a>
        <a href="soldout.html" class="nav-item active"><span class="nav-icon">🏆</span>เครดิต</a>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
