<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ประเมินราคามือถือ - ClearMobi</title>
    <style>
        /* สไตล์แบบ Glassmorphism ตึงๆ */
        body {
            background: #0f172a;
            color: white;
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .upload-box {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 20px 10px;
            text-align: center;
            cursor: pointer;
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
            min-height: 80px;
        }
        .upload-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            display: none;
        }
        .upload-box.uploaded img {
            display: block;
        }
        .upload-icon {
            font-size: 24px;
            margin-bottom: 5px;
        }
        .upload-text {
            font-size: 12px;
            z-index: 2;
            position: relative;
        }
        .btn-eval {
            background: linear-gradient(90deg, #3b82f6, #2563eb);
            border: none;
            border-radius: 25px;
            color: white;
            padding: 15px 20px;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        #priceResult {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background: rgba(34, 197, 94, 0.2);
            border-radius: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h2 style="text-align: center;">ถ่ายรูปประเมินราคา</h2>
    <p style="text-align: center; font-size: 14px; color: #cbd5e1;">กรุณาถ่ายรูปให้ครบทั้ง 9 มุม</p>

    <div class="grid-container" id="uploadGrid">
        <!-- สร้างกล่อง 9 มุม -->
        <div class="upload-box" onclick="openCamera(this)"><div class="upload-icon">📱</div><div class="upload-text">ถ่ายหน้าจอมืด</div><img src=""></div>
        <div class="upload-box" onclick="openCamera(this)"><div class="upload-icon">📱</div><div class="upload-text">ถ่ายหลังเครื่อง</div><img src=""></div>
        <div class="upload-box" onclick="openCamera(this)"><div class="upload-icon">📱</div><div class="upload-text">ซุมถ่ายเลนส์กล้อง</div><img src=""></div>
        <div class="upload-box" onclick="openCamera(this)"><div class="upload-icon">📱</div><div class="upload-text">ถ่ายขอบซ้าย</div><img src=""></div>
        <div class="upload-box" onclick="openCamera(this)"><div class="upload-icon">📱</div><div class="upload-text">ถ่ายขอบบน</div><img src=""></div>
        <div class="upload-box" onclick="openCamera(this)"><div class="upload-icon">📱</div><div class="upload-text">ถ่ายขอบขวา</div><img src=""></div>
        <div class="upload-box" onclick="openCamera(this)"><div class="upload-icon">📱</div><div class="upload-text">ถ่ายตูดชาร์จ</div><img src=""></div>
        <div class="upload-box" onclick="openCamera(this)"><div class="upload-icon">📱</div><div class="upload-text">หน้าจอเกี่ยวกับ</div><img src=""></div>
        <div class="upload-box" onclick="openCamera(this)"><div class="upload-icon">📱</div><div class="upload-text">เปอร์เซ็นแบตเตอร์รี่</div><img src=""></div>
    </div>

    <button id="btnEval" class="btn-eval" onclick="evaluatePrice()">วิเคราะห์ราคา</button>

    <div id="priceResult">
        <h3>ราคาประเมินเบื้องต้น</h3>
        <h1 style="color: #4ade80;">5,000 บาท</h1>
        <p style="font-size: 12px; color: #cbd5e1;">(ราคานี้อาจเปลี่ยนแปลงตามสภาพจริง)</p>
    </div>

    <script>
        let uploadCount = 0;
        let currentUploadBox = null;

        // สร้าง Input แบบซ่อน เพื่อใช้เรียกกล้องหลัง
        const cameraInput = document.createElement('input');
        cameraInput.type = 'file';
        cameraInput.accept = 'image/*';
        cameraInput.capture = 'environment';

        // ดักจับเมื่อผู้ใช้ถ่ายรูปเสร็จ
        cameraInput.addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file || !currentUploadBox) return;

            const textEl = currentUploadBox.querySelector('.upload-text');
            const originalText = textEl.innerText;
            textEl.innerText = "กำลังประมวลผล...";

            try {
                // ใช้ FileReader แปลงรูปเพื่อนำมาพรีวิวบนหน้าจอ
                const reader = new FileReader();
                reader.onload = function(event) {
                    const imgEl = currentUploadBox.querySelector('img');
                    imgEl.src = event.target.result;

                    if (!currentUploadBox.classList.contains('uploaded')) {
                        currentUploadBox.classList.add('uploaded');
                    }
                    textEl.innerText = "ถ่ายแล้ว";
                    textEl.style.textShadow = "0px 0px 5px #000";

                    uploadCount = document.querySelectorAll('.upload-box.uploaded').length;
                };
                reader.readAsDataURL(file);

            } catch (err) {
                console.error("Error:", err);
                textEl.innerText = originalText;
                alert("⚠️ เกิดข้อผิดพลาดในการโหลดรูป");
            }

            // ล้างค่าเพื่อให้เปิดกล้องใหม่ได้
            cameraInput.value = '';
            currentUploadBox = null;
        });

        // ฟังก์ชันสั่งคลิก Input ซ่อน เพื่อเปิดกล้อง
        function openCamera(el) {
            currentUploadBox = el;
            cameraInput.click();
        }

        // ฟังก์ชันกดปุ่มประเมินราคา
        function evaluatePrice() {
            if(uploadCount < 9) {
                alert('⚠️ กรุณาอัปโหลดรูปภาพให้ครบ 9 มุมก่อนครับ (ตอนนี้มี ' + uploadCount + ' รูป)');
                return;
            }

            const btn = document.getElementById('btnEval');
            btn.innerText = 'AI กำลังวิเคราะห์...';
            btn.disabled = true;

            // จำลองเวลาโหลดข้อมูล
            setTimeout(() => {
                document.getElementById('priceResult').style.display = 'block';
                window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
                btn.innerText = 'วิเคราะห์ราคา';
                btn.disabled = false;
            }, 2000);
        }
    </script>
</body>
</html>
