<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ClearMobi | ตลาดมือถือ</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .filter-bar { display: flex; gap: 8px; margin-bottom: 20px; justify-content: flex-start; overflow-x: auto; padding-bottom: 5px; }
        .filter-bar::-webkit-scrollbar { display: none; }
        .filter-btn { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid var(--glass-border); padding: 8px 18px; border-radius: 20px; font-size: 12px; cursor: pointer; flex-shrink: 0;}
        .filter-btn.active { background: var(--accent-blue); border-color: var(--accent-blue); font-weight: bold; }

        .product-list { display: flex; flex-direction: column; gap: 15px; }
        .product-card {
            display: flex; flex-direction: row; align-items: center; gap: 15px;
            padding: 15px; background: var(--glass-dark);
            border-radius: 20px; border: 1px solid var(--glass-border);
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .prod-img-wrapper { width: 90px; height: 90px; flex-shrink: 0; background: rgba(255,255,255,0.05); border-radius: 15px; display: flex; justify-content: center; align-items: center; cursor: pointer;}
        .prod-img { width: 80%; height: 80%; object-fit: contain; filter: drop-shadow(0 5px 10px rgba(0,0,0,0.5)); transition: transform 0.3s; }
        .prod-img-wrapper:active .prod-img { transform: scale(1.1); }

        .prod-info { flex: 1; text-align: left; display: flex; flex-direction: column; justify-content: center; }
        .prod-title { font-size: 15px; color: #fff; font-weight: bold; margin-bottom: 2px; line-height: 1.2; }
        .prod-cond { font-size: 11px; color: var(--accent-green); margin-bottom: 5px; }
        .prod-price { font-size: 18px; font-weight: bold; color: #60a5fa; margin-bottom: 8px; }
        .btn-buy-sm { background: linear-gradient(90deg, #1e3a8a, #3b82f6); border: none; color: white; padding: 8px 20px; border-radius: 12px; font-weight: bold; font-size: 12px; align-self: flex-start; cursor: pointer;}
    </style>
</head>
<body class="theme-spirited">

    <div class="top-nav">
        <a href="index.html" style="position: absolute; left: 20px; font-size: 20px; text-decoration: none; color: inherit;">←</a>
        <div class="logo-c" style="font-size: 18px;">ตลาดมือถือ</div>
    </div>

    <div class="container">
        <div class="filter-bar" id="filterBar">
            <div class="filter-btn active" onclick="renderProducts('all')">🌟 ทั้งหมด</div>
            <div class="filter-btn" onclick="renderProducts('apple')">🍎 iPhone</div>
            <div class="filter-btn" onclick="renderProducts('samsung')">🤖 Galaxy</div>
            <div class="filter-btn" onclick="renderProducts('gradeS')">✨ เกรดนางฟ้า</div>
        </div>

        <div class="product-list" id="productGrid">
            </div>
    </div>

    <div class="bottom-nav">
        <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span>หน้าแรก</a>
        <a href="marketplace.html" class="nav-item active"><span class="nav-icon">🛒</span>ซื้อ</a>
        <a href="evaluate.html" class="nav-item"><span class="nav-icon">🤝</span>ขาย</a>
        <a href="trade-in.html" class="nav-item"><span class="nav-icon">🔄</span>เทิร์น</a>
        <a href="tracking.html" class="nav-item"><span class="nav-icon">📍</span>สถานะ</a>
        <a href="soldout.html" class="nav-item"><span class="nav-icon">🏆</span>เครดิต</a>
    </div>

    <script src="js/app.js"></script>
    <script>
        // 1. จำลองฐานข้อมูลสินค้าเป็น JSON (พร้อมต่อ API ของจริง)
        const mockDatabase = [
            { id: 1, brand: "apple", name: "iPhone 13 Pro Max", cond: "✨ เกรด S (100%)", price: 23000, img: "images/phone1.webp" },
            { id: 2, brand: "samsung", name: "Galaxy S23 Ultra", cond: "✅ เกรด A (95%+)", price: 28000, img: "images/phone2.webp" },
            { id: 3, brand: "apple", name: "iPhone 14 (128GB)", cond: "✅ เกรด A (95%+)", price: 18500, img: "images/phone-14-blue.webp" },
            { id: 4, brand: "apple", name: "iPhone 14 Pro", cond: "✨ เกรด S (100%)", price: 29900, img: "images/product-iphone14-hero.webp" }
        ];

        // 2. ฟังก์ชันวาดหน้าจอ (Render)
        function renderProducts(filterStr) {
            // จัดการสีปุ่ม Filter ให้เป็น Active
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');

            const grid = document.getElementById('productGrid');
            grid.innerHTML = ''; // ล้างข้อมูลเก่าทิ้งก่อน

            // กรองข้อมูลตามที่เลือก
            const filteredProducts = mockDatabase.filter(product => {
                if (filterStr === 'all') return true;
                if (filterStr === 'gradeS') return product.cond.includes('เกรด S');
                return product.brand === filterStr;
            });

            // ถ้าไม่มีสินค้า
            if (filteredProducts.length === 0) {
                grid.innerHTML = `<p style="text-align: center; color: var(--text-muted); margin-top: 20px;">ไม่มีสินค้าในหมวดหมู่นี้</p>`;
                return;
            }

            // วนลูปสร้าง HTML ของสินค้าแต่ละชิ้น
            filteredProducts.forEach(product => {
                const html = `
                <div class="product-card">
                    <div class="prod-img-wrapper" onclick="window.location.href='product.html'">
                        <img src="${product.img}" class="prod-img" alt="${product.name}">
                    </div>
                    <div class="prod-info">
                        <div class="prod-title">${product.name}</div>
                        <div class="prod-cond">${product.cond}</div>
                        <div class="prod-price">฿${product.price.toLocaleString()}</div>
                        <button class="btn-buy-sm" id="buyBtn_${product.id}" onclick="processPurchase(${product.id})">🛍️ สั่งซื้อ</button>
                    </div>
                </div>`;
                grid.insertAdjacentHTML('beforeend', html);
            });
        }

        // 3. ฟังก์ชันสั่งซื้อ (ที่จะตรวจสอบการ Login ก่อน)
        function processPurchase(productId) {
            // เรียก requireLogin จาก app.js (ถ้ายืนยันตัวตนผ่าน ถึงจะรันโค้ดด้านใน)
            requireLogin(() => {
                ActionLock.lock(`buyBtn_${productId}`, 'จอง...');
                setTimeout(() => {
                    alert('🎉 จองสินค้าสำเร็จ แอดมินรับทราบคำสั่งซื้อเรียบร้อยครับ (ระบบทดสอบ)');
                    ActionLock.unlock(`buyBtn_${productId}`);
                }, 1000);
            });
        }

        // 4. โหลดสินค้าทั้งหมดตอนเปิดหน้าเว็บครั้งแรก
        window.onload = () => {
            // จำลองการคลิกปุ่ม "ทั้งหมด"
            document.querySelector('.filter-btn').click();
        };
    </script>
</body>
</html>
