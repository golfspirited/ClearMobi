<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ClearMobi | รายละเอียดสินค้า</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .product-header { text-align: center; margin-bottom: 15px; }

        /* 1. ภาพหลัก (หน้า-หลัง) ซูมไม่ได้ */
        .hero-img-box { background: rgba(255,255,255,0.05); border-radius: 15px; padding: 10px; margin-bottom: 15px; border: 1px solid var(--glass-border); }
        .hero-img { width: 100%; max-height: 220px; object-fit: contain; pointer-events: none; /* ห้ามคลิกซูม */ filter: drop-shadow(0 10px 15px rgba(0,0,0,0.3)); }

        /* 2-15. แถบภาพเลื่อนแนวนอน (กดซูมได้) */
        .gallery-scroll {
            display: flex; overflow-x: auto; gap: 10px; padding-bottom: 10px; margin-bottom: 15px;
            scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch;
        }
        .gallery-scroll::-webkit-scrollbar { display: none; }
        .gallery-item {
            flex: 0 0 auto; width: 80px; height: 100px; scroll-snap-align: start;
            border-radius: 10px; border: 1px solid var(--glass-border); cursor: pointer;
            background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center;
        }
        .gallery-item img { width: 90%; height: 90%; object-fit: contain; transition: transform 0.2s; }
        .gallery-item:active img { transform: scale(1.1); }

        .spec-box { background: rgba(0,0,0,0.2); padding: 15px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.05); font-size: 12px; color: var(--text-muted); text-align: left; line-height: 1.8; margin-bottom: 20px;}
        .highlight { color: #fff; font-weight: bold; }

        /* ระบบ Modal ซูมรูป */
        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100vw; height: 100dvh; background-color: rgba(0,0,0,0.9); align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s ease; backdrop-filter: blur(10px); }
        .modal.show { display: flex; opacity: 1; }
        .modal-content { max-width: 95%; max-height: 90%; object-fit: contain; border-radius: 10px; transform: scale(0.8); transition: transform 0.3s ease; }
        .modal.show .modal-content { transform: scale(1); }
        .modal-close { position: absolute; top: 20px; right: 25px; color: #fff; font-size: 40px; font-weight: bold; cursor: pointer; background: rgba(0,0,0,0.5); width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
    </style>
</head>
<body class="theme-spirited">

    <div class="top-nav">
        <a href="marketplace.html" style="position: absolute; left: 20px; text-decoration: none; color: inherit; font-size: 20px;">←</a>
        <div class="logo-c" style="font-size: 18px;">รายละเอียดสินค้า</div>
    </div>

    <div class="container">

        <div class="hero-img-box">
            <img src="images/phone1.png" class="hero-img" alt="Front and Back">
        </div>

        <div class="product-header">
            <h2 style="margin-bottom: 5px; color: #fff; font-size: 22px;">iPhone 14 (128GB)</h2>
            <div style="color: var(--accent-blue); font-size: 28px; font-weight: bold;">฿18,500</div>
        </div>

        <p style="font-size: 11px; color: var(--accent-green); margin-bottom: 8px;">📸 เลื่อนดูภาพมุมต่างๆ (แตะเพื่อซูม)</p>
        <div class="gallery-scroll">
            <div class="gallery-item" onclick="openZoom(this.children[0].src)"><img src="images/phone-14-blue.png"></div>
            <div class="gallery-item" onclick="openZoom(this.children[0].src)"><img src="images/phone-14-back.png"></div>
            <div class="gallery-item" onclick="openZoom(this.children[0].src)"><img src="images/phone-lens-macro.png"></div>
            <div class="gallery-item" onclick="openZoom(this.children[0].src)"><img src="images/phone2.png"></div>
            <div class="gallery-item" onclick="openZoom(this.children[0].src)"><img src="images/phone1.png"></div>
            </div>

        <div class="spec-box">
            ✅ <span class="highlight">สภาพ:</span> นางฟ้า (98%) ไม่มีรอยตกหล่น<br>
            ✅ <span class="highlight">แบตเตอรี่:</span> สุขภาพ 95%<br>
            ✅ <span class="highlight">อุปกรณ์:</span> ครบกล่อง (สายชาร์จแท้)<br>
            🛡️ <span class="highlight">ประกัน:</span> รับสิทธิ์ประกันใจ 28 วัน (เมื่อทำภารกิจ)
        </div>

        <div style="margin-top: 10px;">
            <button class="btn-glow-blue" id="buyBtn" onclick="buyProduct()">🛍️ ยืนยันคำสั่งซื้อ</button>
        </div>

    </div>

    <div id="imageModal" class="modal" onclick="closeZoom()">
        <div class="modal-close">&times;</div>
        <img class="modal-content" id="modalImg" onclick="event.stopPropagation()">
    </div>

    <div class="bottom-nav">
        <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span>หน้าแรก</a>
        <a href="marketplace.html" class="nav-item active"><span class="nav-icon">🛒</span>ซื้อ</a>
        <a href="evaluate.html" class="nav-item"><span class="nav-icon">🤝</span>ขาย</a>
        <a href="trade-in.html" class="nav-item"><span class="nav-icon">🔄</span>เทิร์น</a>
        <a href="tracking.html" class="nav-item"><span class="nav-icon">📍</span>สถานะ</a>
        <a href="soldout.html" class="nav-item"><span class="nav-icon">🏆</span>เครดิต</a>
    </div>

    <script src="js/app.js"></script>
    <script>
        // ระบบซูมภาพ
        function openZoom(imgSrc) {
            document.getElementById('modalImg').src = imgSrc;
            document.getElementById('imageModal').classList.add('show');
        }
        function closeZoom() {
            document.getElementById('imageModal').classList.remove('show');
        }

        function buyProduct() {
            ActionLock.lock('buyBtn', 'กำลังส่งคำสั่งซื้อ...');
            setTimeout(() => {
                alert('🎉 สั่งซื้อสำเร็จ! ระบบกำลังจัดส่งแบบเก็บเงินปลายทาง แอดมินได้รับแจ้งเตือนทาง Telegram แล้ว');
                AppState.set('last_tx', 'buy');
                AppState.set('quest_step', '0');
                window.location.href = 'tracking.html';
            }, 1000);
        }
    </script>
</body>
</html>
